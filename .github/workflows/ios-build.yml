
name: Compilar GalaxyFit3 iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone físico
        run: |
          xcodebuild \
            -project GalaxyFit3iOS.xcodeproj \
            -scheme GalaxyFit3iOS \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar IPA sin firma
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/GalaxyFit3iOS.app Payload/
          /usr/bin/zip -r GalaxyFit3iOS-unsigned.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyFit3iOS-IPA
          path: GalaxyFit3iOS-unsigned.ipa
